name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openai,anthropic]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q --cov=lenstrace --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  package:
    name: package (wheel includes UI)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build wheel with vendored UI
        run: |
          python -m pip install --upgrade pip build
          rm -rf src/lenstrace/_webui && cp -r frontend/dist src/lenstrace/_webui
          python -m build --wheel
      - name: Assert UI is inside the wheel
        run: python -m zipfile -l dist/lenstrace-*.whl | grep -q 'lenstrace/_webui/index.html'
      - name: Install wheel in a clean venv and smoke-test the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/lenstrace-*.whl
          /tmp/clean/bin/lenstrace version
          /tmp/clean/bin/lenstrace demo --db /tmp/smoke.db -n 1 --seed 1
          /tmp/clean/bin/lenstrace info --db /tmp/smoke.db
