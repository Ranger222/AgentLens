[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lenstrace"
version = "0.1.0"
description = "Chrome DevTools for your AI agents — local-first tracing & observability for Python LLM-agent systems."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Piyush Singh Tomar" }]
keywords = [
    "llm", "agents", "observability", "tracing", "openai", "anthropic",
    "langchain", "debugging", "telemetry", "spans",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# The SDK core (tracing) is stdlib-only. fastapi/uvicorn are required so the
# one-command `lenstrace serve` works out of the box, but they are imported
# lazily inside lenstrace.server so `import lenstrace` stays light & fast.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "hatchling>=1.21",
]

[project.urls]
Homepage = "https://github.com/Ranger222/LensTrace"
Repository = "https://github.com/Ranger222/LensTrace"
Issues = "https://github.com/Ranger222/LensTrace/issues"

[project.scripts]
lenstrace = "lenstrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lenstrace"]
# Ship the built React dashboard (when present) inside the wheel.
artifacts = ["src/lenstrace/_webui/**"]

[tool.hatch.build.targets.sdist]
include = ["src/lenstrace", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:lenstrace.*"]

[tool.coverage.run]
source = ["lenstrace"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter; long strings are fine
    "SIM105", # `try/except: pass` is intentional for best-effort/never-raise paths
    "B027",   # Storage.close() is a deliberate optional (non-abstract) override hook
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
# mypy itself requires a >=3.10 target; runtime 3.9 support is verified by the
# CI test matrix + ruff's py39 target. Annotations are 3.9-safe (__future__).
python_version = "3.10"
packages = ["lenstrace"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
